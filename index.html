
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DannyPipe96</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:#fff;font-family:Arial,sans-serif}
header{padding:24px 5%;display:flex;align-items:center;justify-content:space-between;background:#10131d;gap:20px;flex-wrap:wrap}
.logo{font-size:30px;font-weight:bold;color:#63e6be}
nav{display:flex;gap:22px;color:#ddd;font-size:17px}
main{padding:28px 5%}
h1{font-size:32px;margin-bottom:8px}
p{color:#aeb5c5}
.tools{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}
input,button,select{background:#171b28;color:#fff;border:1px solid #444b60;border-radius:7px;padding:13px;font-size:16px}
input{width:min(420px,100%)}
button{cursor:pointer}
button:focus,input:focus,.card:focus{outline:3px solid #63e6be;outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
.card{background:#171b28;border:2px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer}
.poster{width:100%;height:190px;object-fit:cover;background:#202638}
.card h3{font-size:15px;margin:10px;line-height:1.35}
#status{min-height:24px;color:#63e6be}
#playerBox{display:none;margin:24px 0;background:#171b28;padding:16px;border-radius:10px}
video{width:100%;max-height:65vh;background:#000}
#files button{margin:6px}
footer{padding:30px 5%;color:#8992a8}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}nav{gap:10px;font-size:14px}}
</style>
</head>
<body>
<header>
<div class="logo">DannyPipe96</div>
<nav><span>Inicio</span><span>Series</span><span>Mini dramas</span><span>Películas</span></nav>
</header>
<main>
<h1>Tu entretenimiento, en un solo lugar</h1>
<p>Busca títulos disponibles en el catálogo audiovisual de Internet Archive.</p>
<div class="tools">
<select id="category" aria-label="Tipo de contenido">
<option value="all">Todo el contenido</option>
<option value="movies">Películas</option>
<option value="series">Series y programas</option>
<option value="shorts">Mini dramas y cortos</option>
<option value="anime">Anime y animación</option>
<option value="documentary">Documentales</option>
</select>
<input id="search" type="search" placeholder="Buscar por título..." aria-label="Buscar contenido">
<button id="searchBtn">Buscar</button>
</div>
<div id="status" role="status">Escribe un título para buscar.</div>
<div class="grid" id="catalog"></div>
<section id="playerBox">
<h2 id="selectedTitle">Reproducir</h2>
<video id="player" controls playsinline></video>
<div id="files"></div>
</section>
</main>
<footer>DannyPipe96 · Catálogo integrado</footer>
<script src="api.js"></script>
<script>
const catalog=document.getElementById('catalog');
const statusEl=document.getElementById('status');
const searchInput=document.getElementById('search');
const playerBox=document.getElementById('playerBox');
const player=document.getElementById('player');
const filesBox=document.getElementById('files');

function render(items){
  catalog.replaceChildren();
  if(!items.length){
    statusEl.textContent='No se encontraron resultados. Prueba otro título.';
    return;
  }
  items.forEach(item=>{
    const card=document.createElement('div');
    card.className='card';
    card.tabIndex=0;
    const img=document.createElement('img');
    img.className='poster';
    img.loading='lazy';
    img.alt='';
    img.src=item.poster;
    img.onerror=()=>{img.style.visibility='hidden';};
    const title=document.createElement('h3');
    title.textContent=item.title;
    card.append(img,title);
    const open=()=>showFiles(item);
    card.addEventListener('click',open);
    card.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}
    });
    catalog.append(card);
  });
}

async function search(){
  const query=searchInput.value.trim();
  if(!query){statusEl.textContent='Escribe el título que quieres buscar.';return;}
  statusEl.textContent='Buscando títulos...';
  catalog.replaceChildren();
  player.pause();
  player.removeAttribute('src');
  player.load();
  playerBox.style.display='none';
  try{
    const category=document.getElementById('category').value;
    const items=await SEEKeeAPI.search(query,category,1);
    statusEl.textContent='Comprobando idioma y enlaces directos...';
    const verified=await Promise.all(items.map(async item=>{
      try{
        const videos=item.playableFiles || await SEEKeeAPI.files(item.id);
        const usable=videos.filter(file=>
          file.url && /^https?:\/\//i.test(file.url) &&
          /\.(mp4|webm|ogv|m4v)(?:[?#]|$)/i.test(file.url)
        );
        return usable.length ? {...item, playableFiles:usable} : null;
      }catch{
        return null;
      }
    }));
    const playable=verified.filter(Boolean);
    statusEl.textContent='Resultados con enlaces directos: '+playable.length;
    render(playable);
  }catch(err){
    statusEl.textContent='No se pudo cargar el catálogo. Comprueba la conexión e inténtalo de nuevo.';
    console.error(err);
  }
}

async function showFiles(item){
  playerBox.style.display='block';
  document.getElementById('selectedTitle').textContent=item.title;
  filesBox.replaceChildren();
  statusEl.textContent='Buscando archivos de vídeo...';
  try{
    const videos=item.playableFiles || await SEEKeeAPI.files(item.id);
    if(!videos.length){
      filesBox.textContent='Este título no tiene un archivo de vídeo compatible disponible.';
    }else{
      videos.forEach(file=>{
        const btn=document.createElement('button');
        btn.textContent=file.name;
        btn.addEventListener('click',()=>{
          player.src=file.url;
          player.load();
          player.play().catch(err=>{statusEl.textContent="No se pudo iniciar la reproducción: "+err.message;});
        });
        filesBox.append(btn);
      });
      filesBox.insertAdjacentText('afterbegin','Selecciona un archivo para reproducirlo: ');
    }
    statusEl.textContent='Ficha seleccionada: '+item.title;
    playerBox.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(err){
    filesBox.textContent='No se pudieron consultar los archivos disponibles.';
    statusEl.textContent='Error al consultar el contenido.';
  }
}
player.addEventListener("error",()=>{const e=player.error;statusEl.textContent="Error de reproducción"+(e?" (código "+e.code+")":"")+". Prueba otra resolución o archivo.";});
document.getElementById('searchBtn').addEventListener('click',search);
searchInput.addEventListener('keydown',e=>{if(e.key==='Enter')search();});
</script>
</body>
  </html>
